################################################################################
#  EduPlatform – Docker Compose  (all backend services + infra)
#
#  Usage:
#    docker compose up -d          # start everything
#    docker compose logs -f        # tail all logs
#    docker compose down -v        # stop & remove volumes
#
#  Eureka dashboard:  http://localhost:8761
#  API Gateway:       http://localhost:9090
################################################################################

services:

  # ── Infrastructure ──────────────────────────────────────────

  mysql:
    image: mysql:8.0
    container_name: edu-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: matkhaumysql
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/docker-init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pmatkhaumysql"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: edu-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Service Discovery ───────────────────────────────────────

  eureka-server:
    build:
      context: ./backend/onlineCourses/eureka-server
      dockerfile: ../../Dockerfile.service
    container_name: edu-eureka
    restart: unless-stopped
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── API Gateway ─────────────────────────────────────────────

  chatbot-proxy:
    build:
      context: ./backend/chatbot-proxy
      dockerfile: Dockerfile
    container_name: edu-chatbot-proxy
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
    env_file:
      - ./backend/chatbot-proxy/.env

  api-gateway:
    build:
      context: ./backend/onlineCourses/api-gateway
      dockerfile: ../../Dockerfile.service
    container_name: edu-gateway
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      REDIS_HOST: redis
      USER_SERVICE_URL: http://user-service:8080
      LESSON_SERVICE_URL: http://lesson-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8081
      STATISTIC_SERVICE_URL: http://statistic-service:8084
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── User Service ────────────────────────────────────────────

  user-service:
    build:
      context: ./backend/onlineCourses/user-service
      dockerfile: ../../Dockerfile.service
    container_name: edu-user
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/Service_user?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: matkhaumysql
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  # ── Courses Service ─────────────────────────────────────────

  courses-service:
    build:
      context: ./backend/onlineCourses/courses-service
      dockerfile: ../../Dockerfile.service
    container_name: edu-courses
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/course_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: matkhaumysql
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  # ── Lesson Service ──────────────────────────────────────────

  lesson-service:
    build:
      context: ./backend/onlineCourses/lesson-service
      dockerfile: ../../Dockerfile.service
    container_name: edu-lessons
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/lesson_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: matkhaumysql
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  # ── Statistics Service ──────────────────────────────────────

  statistic-service:
    build:
      context: ./backend/onlineCourses/statistic-service
      dockerfile: ../../Dockerfile.service
    container_name: edu-statistics
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      USER_SERVICE_URL: http://user-service:8080
    depends_on:
      eureka-server:
        condition: service_healthy

  # ── Payment Service ─────────────────────────────────────────

  payment-service:
    build:
      context: ./backend/payment
      dockerfile: ../Dockerfile.service
    container_name: edu-payment
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/vnpay_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: matkhaumysql
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

volumes:
  mysql-data:
