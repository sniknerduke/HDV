spring.application.name=api-gateway
server.port=9090

spring.config.import=optional:configserver:http://localhost:9090


# ==== ROUTES ====
# Route to cart-service
spring.cloud.gateway.routes[0].id=cart-service
spring.cloud.gateway.routes[0].uri=http://localhost:8080
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/cart/**
#spring.cloud.gateway.routes[0].predicates[1]=Path=/api/orders/**
#spring.cloud.gateway.routes[0].predicates[2]=Path=/api/users/**

# ================= ORDER SERVICE =================
spring.cloud.gateway.routes[1].id=order-service
spring.cloud.gateway.routes[1].uri=http://localhost:8080
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/orders/**

# ================= USER SERVICE =================
spring.cloud.gateway.routes[2].id=user-service
#spring.cloud.gateway.routes[2].uri=http://localhost:8080
spring.cloud.gateway.routes[2].uri=lb://onlineCourses
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/users/**

# Route for user-courses (also in user-service)
spring.cloud.gateway.routes[7].id=user-courses-service
spring.cloud.gateway.routes[7].uri=http://localhost:8080
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/user-courses/**


# Route to user-service
spring.cloud.gateway.routes[3].id=course-service
#spring.cloud.gateway.routes[3].uri=http://localhost:8082
spring.cloud.gateway.routes[3].uri=lb://courses
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/courses/**

# Route to lesson-service
spring.cloud.gateway.routes[4].id=lesson-service
spring.cloud.gateway.routes[4].uri=http://localhost:8083
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/lessons/**

# Route to payment-service
spring.cloud.gateway.routes[5].id=payment-service
spring.cloud.gateway.routes[5].uri=http://localhost:8081
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/payment/**

## Route to user-service
#spring.cloud.gateway.routes[5].id=payment-service
#spring.cloud.gateway.routes[5].uri=http://localhost:8081
#spring.cloud.gateway.routes[5].predicates[0]=Path=/payment/vnpay/**

# comment english gium cai
spring.cloud.gateway.routes[6].id=statistic-service
spring.cloud.gateway.routes[6].uri=http://localhost:8084
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/statistics/**

# ==== CORS CONFIG ====
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:3000
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web.cors=DEBUG

#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
spring.autoconfigure.exclude=\
org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration,\
org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration,\
org.springframework.boot.actuate.autoconfigure.security.reactive.ReactiveManagementWebSecurityAutoConfiguration

# Call POST /actuator/refresh for hot reload in Spring Cloud Gateway
management.endpoints.web.exposure.include=refresh,health,info

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

